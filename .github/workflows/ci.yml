# SHIP-V1-GAPS.md #7: per-package CI workflow.
#
# Each push + PR runs typecheck + agentic-smoke for the IDE itself, and the
# `version-consistency` job blocks anything that drifts the four version
# sources (see scripts/verify-version.ts). Release builds live in
# release.yml on tag push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-consistency:
    name: Verify version sources agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun scripts/verify-version.ts

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save || true
      # The typecheck is clean and gates for real. The previous version of this
      # step piped tsc through a ~30-pattern "known noise" filter, but the pipe
      # ran under `set -o pipefail`, so a non-zero tsc exit killed the step
      # before the filter was ever consulted — the job had failed on every run
      # since May and gated nothing. The noise it filtered is gone: `perry/i18n`
      # and `widgetSetTooltip` now have real declarations in src/types/, the
      # agentic seed fixtures are excluded in tsconfig, and the ViewportManager /
      # textSetFontFamily errors it hid were genuine bugs (now fixed). Keep this
      # step plain — if it goes red, something is actually broken.
      - name: typecheck
        run: bun run typecheck

  perry-compile-macos:
    name: Perry compile macOS
    runs-on: macos-14
    if: false  # enabled once perry runner image is published
    steps:
      - uses: actions/checkout@v4
      - run: perry compile src/app.ts --target macos --output hone-ide

  perry-compile-windows:
    name: Perry compile Windows
    runs-on: windows-latest
    if: false  # enabled once perry runner image is published
    steps:
      - uses: actions/checkout@v4
      - run: perry compile src/app.ts --target windows --output hone-ide.exe
